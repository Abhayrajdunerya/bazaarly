spring:
  application:
    name: gatewayserver
  config:
    import:
      - "optional:configserver:http://localhost:8071/"
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7080/realms/bazaarly # validates the iss claim
          jwk-set-uri: http://localhost:7080/realms/bazaarly/protocol/openid-connect/certs
          # audiences: bazaarly-api    # turn on after you add the audience mapper in Keycloak

# management:
#   endpoints:
#     web:
#       exposure:
#         include: "*"
#   endpoint:
#     gateway:
#       access: unrestricted
#   info:
#     env:
#       enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    gateway:
      access: none

info:
  app:
    name: gatewayserver
    description: Bazaarly Gateway Server Application
    version: 1.0.0

logging:
  pattern:
    console: ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}
  level:
    com:
      bazaarly:
        gatewayserver: DEBUG
